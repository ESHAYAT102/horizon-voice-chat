name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - run: cargo fmt --check
      - run: cargo test --locked --features client
      - run: cargo clippy --locked --all-targets --features client -- -D warnings
      - run: for f in scripts/*.sh; do sh -n "$f"; done
      - run: sh scripts/test-install.sh
      - run: |
          cd mod
          cargo fmt --check
