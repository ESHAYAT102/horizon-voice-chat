[package]
name = "horizon-voice-mod"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false
description = "Horizon mod half of Horizon Voice Chat: /voice, the microphone HUD and the control channel to the helper"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { git = "https://github.com/ludovic111/horizon", rev = "6f8cad0020d77f1bfcc3c869019c0e0efa21f683" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
